name: ci

on:
  push:
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o wphunter ./cmd/wphunter

      # Teste de comportamento (positivo): o scanner DEVE acusar o demo-plugin.
      # wphunter sai com codigo 1 quando acha algo CRITICAL, entao invertemos:
      # detectar = sucesso.
      - name: deteccao (deve achar no lab/demo-plugin)
        run: |
          if ./wphunter -path lab/demo-plugin; then
            echo "FALHA: esperava deteccao no demo-plugin e nao houve"; exit 1
          else
            echo "OK: demo-plugin detectado (exit != 0 esperado)"
          fi

      # Teste de comportamento (negativo): dir limpo nao pode gerar CRITICAL.
      - name: sem falso-positivo (dir limpo)
        run: |
          mkdir -p /tmp/clean/wp-content/plugins/realplugin
          echo "readme" > /tmp/clean/wp-content/plugins/realplugin/readme.txt
          ./wphunter -path /tmp/clean
          echo "OK: dir limpo sem achados CRITICAL"
